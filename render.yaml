# Render Blueprint — DesignForge API (free web service; sleeps after ~15 min idle — see docs/07-DEPLOYMENT.md)
services:
  - type: web
    name: designforge-api
    runtime: node
    plan: free
    region: singapore
    # --include=dev is required: Render sets NODE_ENV=production, which would skip TypeScript + @types and fail the build.
    buildCommand: npm ci --include=dev --workspace packages/shared --workspace apps/api --include-workspace-root && npm --workspace packages/shared run build && npm --workspace apps/api run build
    startCommand: npm --workspace apps/api run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MAX_CONCURRENT_JOBS
        value: "3"
      # Secrets: set in the Render dashboard (sync: false = never stored in this file)
      - { key: CORS_ORIGINS, sync: false }
      - { key: PUBLIC_WEB_URL, sync: false }
      - { key: FIREBASE_SERVICE_ACCOUNT_BASE64, sync: false }
      - { key: FIREBASE_PROJECT_ID, sync: false }
      - { key: ENCRYPTION_KEY, sync: false }
      - { key: ENCRYPTION_KEY_ID, sync: false }
      # Razorpay (RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET): add all three in the
      # dashboard when ready. With none set the API runs with payments disabled; a partial set fails startup.
